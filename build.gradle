plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def supportedMinecraftVersions = [
        '26.1.2': [fabricApi: '0.155.2+26.1.2', modMenu: '18.0.0', sourceSet: 'minecraft_26_1_2'],
        '26.2'  : [fabricApi: '0.154.2+26.2', modMenu: '20.0.1', sourceSet: 'minecraft_26_2']
]
def targetMinecraftVersion = project.minecraft_version.toString()
def targetPlatform = supportedMinecraftVersions[targetMinecraftVersion]
if (targetPlatform == null) {
    throw new GradleException("Unsupported Minecraft version '${targetMinecraftVersion}'. Supported: ${supportedMinecraftVersions.keySet().join(', ')}")
}
def targetFabricApiVersion = targetPlatform.fabricApi
def targetModMenuVersion = targetPlatform.modMenu
def targetLoaderVersion = project.loader_version.toString()

def versionCore = project.mod_version.toString()
def releaseChannelKey = project.release_channel.toString().toLowerCase(Locale.ROOT)
def canonicalReleaseChannels = [alpha: 'Alpha', beta: 'Beta', release: 'Release']
def releaseChannel = canonicalReleaseChannels[releaseChannelKey]
if (releaseChannel == null) {
    throw new GradleException("Unsupported release channel '${project.release_channel}'. Supported: Alpha, Beta, Release")
}

def alphaIteration = project.findProperty('alpha_iteration')?.toString()?.trim()
if (releaseChannelKey == 'alpha' && !(alphaIteration ==~ /[1-9][0-9]*/)) {
    throw new GradleException("Alpha builds require a positive numeric alpha_iteration")
}

def releaseBaselineSequenceText = project.findProperty('release_baseline_sequence')?.toString()?.trim()
if (!(releaseBaselineSequenceText ==~ /[1-9][0-9]*/)) {
    throw new GradleException("release_baseline_sequence must be a positive integer")
}
def releaseBaselineSequence = Long.parseLong(releaseBaselineSequenceText)

def channelArtifactSuffix = releaseChannelKey == 'alpha'
        ? "Alpha-${alphaIteration}"
        : releaseChannel
version = "${versionCore}+${targetMinecraftVersion}-${channelArtifactSuffix}"
group = project.maven_group

def expandedVersion = version.toString()
def metadataVersion = releaseChannelKey == 'alpha'
        ? "${versionCore}-alpha.${alphaIteration}+${targetMinecraftVersion}"
        : releaseChannelKey == 'beta'
        ? "${versionCore}-beta+${targetMinecraftVersion}"
        : "${versionCore}+${targetMinecraftVersion}"
def licenseArchiveName = "LICENSE_${project.archives_base_name}"

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        java.srcDir("src/${targetPlatform.sourceSet}/java")
    }
}

if (project.hasProperty('target_build_dir')) {
    layout.buildDirectory = layout.projectDirectory.dir(project.property('target_build_dir').toString())
}

loom {
    runs {
        standaloneClient {
            client()
            runDir = "run-standalone"
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${targetLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${targetFabricApiVersion}"
    compileOnly "com.terraformersmc:modmenu:${targetModMenuVersion}"
    testImplementation "net.fabricmc:fabric-loader-junit:${targetLoaderVersion}"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', metadataVersion
    inputs.property 'minecraft_version', targetMinecraftVersion
    inputs.property 'fabric_api_version', targetFabricApiVersion
    inputs.property 'loader_version', targetLoaderVersion
    inputs.property 'release_channel', releaseChannel
    inputs.property 'version_core', versionCore
    inputs.property 'release_baseline_sequence', releaseBaselineSequence
    // Legacy pre-rendered pet PNGs caused stale/wrong fallbacks. Pet HUD icons
    // now render only verified player-head profiles, so do not ship them.
    exclude 'assets/qcloudy_addition/textures/gui/pets/**'
    exclude 'assets/qcloudy_addition/textures/gui/pet_skins/**'
    exclude '**/.DS_Store'
    filesMatching('fabric.mod.json') {
        expand version: metadataVersion,
                minecraft_version: targetMinecraftVersion,
                fabric_api_version: targetFabricApiVersion,
                loader_version: targetLoaderVersion
    }
    filesMatching('qcloudy_addition.release.properties') {
        expand release_channel: releaseChannel,
                version_core: versionCore,
                minecraft_version: targetMinecraftVersion,
                release_baseline_sequence: releaseBaselineSequence
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
    options.compilerArgs.add('-Xlint:deprecation')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename 'LICENSE', licenseArchiveName
    }
    from('THIRD_PARTY_NOTICES.md')
}

tasks.named('sourcesJar') {
    inputs.property 'version', metadataVersion
    inputs.property 'minecraft_version', targetMinecraftVersion
    inputs.property 'fabric_api_version', targetFabricApiVersion
    inputs.property 'loader_version', targetLoaderVersion
    inputs.property 'release_channel', releaseChannel
    inputs.property 'version_core', versionCore
    inputs.property 'release_baseline_sequence', releaseBaselineSequence
    exclude 'assets/qcloudy_addition/textures/gui/pets/**'
    exclude 'assets/qcloudy_addition/textures/gui/pet_skins/**'
    exclude '**/.DS_Store'
    filesMatching('fabric.mod.json') {
        expand version: metadataVersion,
                minecraft_version: targetMinecraftVersion,
                fabric_api_version: targetFabricApiVersion,
                loader_version: targetLoaderVersion
    }
    filesMatching('qcloudy_addition.release.properties') {
        expand release_channel: releaseChannel,
                version_core: versionCore,
                minecraft_version: targetMinecraftVersion,
                release_baseline_sequence: releaseBaselineSequence
    }
    from('LICENSE') {
        rename 'LICENSE', licenseArchiveName
    }
    from('THIRD_PARTY_NOTICES.md')
}

tasks.register('prepareRelease', Copy) {
    dependsOn tasks.named('build')
    from(layout.buildDirectory.dir('libs'))
    into(layout.projectDirectory.dir('release'))
    include "${project.archives_base_name}-${project.version}.jar"
    include "${project.archives_base_name}-${project.version}-sources.jar"
}
