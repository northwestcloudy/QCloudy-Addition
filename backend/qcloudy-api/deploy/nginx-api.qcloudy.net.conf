limit_req_zone $binary_remote_addr zone=qcloudy_api_per_ip:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.qcloudy.net;
    access_log off;
    # Request-scoped Nginx errors include the full URI. PV identities must not
    # become an error-log query history either.
    error_log /dev/null crit;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.qcloudy.net;
    # Player names/UUIDs are path parameters. Do not create a query-history log.
    access_log off;
    error_log /dev/null crit;

    ssl_certificate /etc/letsencrypt/live/api.qcloudy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.qcloudy.net/privkey.pem;
    client_max_body_size 128k;

    location / {
        limit_req zone=qcloudy_api_per_ip burst=30 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
